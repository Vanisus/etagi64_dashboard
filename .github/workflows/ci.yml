name: ci
on:
  push:
    branches: [main, review/deploy-daily-regions]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: etagi_test
          POSTGRES_USER: etagi
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etagi -d etagi_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_DB: etagi_test
      POSTGRES_USER: etagi
      POSTGRES_PASSWORD: test-password
      DB_HOST: 127.0.0.1
      AUTH_ALLOWED_ORIGINS: http://localhost:5173
      AUTH_COOKIE_SECURE: "false"
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: python -m pytest -q
      - run: docker compose config --quiet
      - run: docker build -t etagi64-dashboard:test .
